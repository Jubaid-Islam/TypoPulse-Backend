services:
  postgres:
    image: postgres:16-alpine
    container_name: typopulse_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: typopulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: typopulse_app
    restart: always
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/typopulse?schema=public"
      PORT: 4000
    depends_on:
      - postgres

volumes:
  pgdata: